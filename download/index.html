<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meet Saaci</title>
  <meta name="description" content="Download Saaci from the App Store." />
  <style>
    :root {
      --bg: #fff8f4;
      --card: #ffffff;
      --ink: #2d2326;
      --muted: #7f6d72;
      --coral: #e07a74;
      --coral-deep: #c96060;
      --ring: #f1ddd8;
      --shadow: 0 12px 30px rgba(102, 54, 54, 0.10);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 92% 8%, #ffe8df 0, transparent 35%),
        radial-gradient(circle at 10% 0%, #ffe3d6 0, transparent 30%),
        var(--bg);
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 22px;
    }
    .wrap { width: 100%; max-width: 460px; }
    .card {
      background: var(--card);
      border: 1px solid var(--ring);
      border-radius: 28px;
      padding: 28px 22px 24px;
      box-shadow: var(--shadow);
      text-align: center;
    }
    .logo {
      width: 76px;
      height: 76px;
      border-radius: 22px;
      object-fit: cover;
      box-shadow: 0 8px 16px rgba(68, 43, 43, 0.16);
      margin-bottom: 18px;
    }
    h1 {
      margin: 0;
      font-size: 34px;
      line-height: 1.08;
      letter-spacing: -0.02em;
      font-weight: 800;
    }
    .subtitle {
      margin: 10px auto 0;
      max-width: 30ch;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.45;
    }
    .cta {
      margin-top: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 56px;
      border: 0;
      border-radius: 18px;
      background: linear-gradient(135deg, var(--coral), var(--coral-deep));
      color: #fff;
      text-decoration: none;
      font-size: 18px;
      font-weight: 750;
      letter-spacing: 0.01em;
      box-shadow: 0 10px 20px rgba(201, 96, 96, 0.30);
      padding: 0 14px;
      -webkit-tap-highlight-color: transparent;
    }
    .cta:active { transform: translateY(1px); }
    .note {
      margin: 16px auto 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
      max-width: 34ch;
    }
    .hint {
      margin-top: 10px;
      color: #8d7c80;
      font-size: 12px;
      min-height: 1.2em;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card" aria-label="Download Saaci">
      <img src="/logo.jpg.jpg" alt="Saaci logo" class="logo" />
      <h1>Meet Saaci</h1>
      <p class="subtitle">Your sickle cell wellness companion.</p>

      <a id="downloadBtn" class="cta" href="https://apple.co/4dhMdAC" target="_self" rel="noopener">
        Download on the App Store
      </a>

      <p class="note">Having trouble opening the App Store? Tap the &#8226;&#8226;&#8226; menu in Instagram and choose 'Open in browser'.</p>
      <p id="hint" class="hint" aria-live="polite"></p>
    </section>
  </main>

  <script>
    (function () {
      var APP_STORE_URL = 'https://apple.co/4dhMdAC';
      var btn = document.getElementById('downloadBtn');
      var hint = document.getElementById('hint');
      var ua = navigator.userAgent || '';

      var isInstagram = /Instagram/i.test(ua);
      var isIOS = /iPhone|iPad|iPod/i.test(ua);
      var isAndroid = /Android/i.test(ua);

      function toSafariScheme(url) {
        return url.replace(/^https:\/\//i, 'x-safari-https://');
      }

      function toAndroidIntent(url) {
        var noProtocol = url.replace(/^https:\/\//i, '');
        return 'intent://' + noProtocol + '#Intent;scheme=https;package=com.android.chrome;end';
      }

      btn.addEventListener('click', function (event) {
        if (!isInstagram) {
          return;
        }

        event.preventDefault();

        var fallbackTimer = setTimeout(function () {
          window.location.href = APP_STORE_URL;
        }, 700);

        try {
          if (isIOS) {
            window.location.href = toSafariScheme(APP_STORE_URL);
            hint.textContent = 'Trying to open your external browser...';
            return;
          }

          if (isAndroid) {
            window.location.href = toAndroidIntent(APP_STORE_URL);
            hint.textContent = 'Trying to open your external browser...';
            return;
          }

          window.location.href = APP_STORE_URL;
        } catch (_) {
          clearTimeout(fallbackTimer);
          window.location.href = APP_STORE_URL;
        }
      });

      if (isInstagram) {
        hint.textContent = 'Instagram browser detected.';
      }
    })();
  </script>
</body>
</html>
